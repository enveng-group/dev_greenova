[mypy]
python_version = 3.12
mypy_path = greenova/stubs
namespace_packages = True
explicit_package_bases = True
ignore_missing_imports = True
disallow_untyped_calls = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = False
no_implicit_optional = True
strict_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_return_any = True
warn_unused_configs = True

# Specify the files to check explicitly to avoid duplicate module discovery
# Use the full module path from the project root
files = greenova

# Exclude patterns for files that should not be checked
exclude = ^greenova/tests/.*\.pyi?$|.*_pb2\.py$|^.*/migrations/.*\.py$|^venv/.*|^\.venv/.*|^.*/__pycache__/.*|^build/.*|^dist/.*

allow_redefinition = True
implicit_reexport = True

# plugins = mypy_django_plugin.main

# [mypy.plugins.django-stubs]
# django_settings_module = greenova.settings

[mypy-*.migrations.*]
ignore_errors = True

[mypy-greenova.tests.*]
ignore_errors = True

[mypy-pytest.*]
ignore_missing_imports = True

[mypy-pytest]
ignore_missing_imports = True

[mypy-django.*]
ignore_missing_imports = True

[mypy-allauth.*]
ignore_missing_imports = True

[mypy-debug_toolbar.*]
ignore_missing_imports = True

[mypy-django_select2.*]
ignore_missing_imports = True

[mypy-django_hyperscript.*]
ignore_missing_imports = True

[mypy-django_htmx.*]
ignore_missing_imports = True

[mypy-dotenv_vault.*]
ignore_missing_imports = True

[mypy-sentry_sdk.*]
ignore_missing_imports = True

[mypy-jinja2.*]
ignore_missing_imports = True

[mypy-beartype.*]
ignore_missing_imports = True

# Protobuf auto-generated files
