[mypy]
python_version = 3.12
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
ignore_missing_imports = false
namespace_packages = true
exclude = 'migrations|venv|\.venv|tests/|test_|__init__\.py|.*_pb2\.py$'

[mypy-django_tables2]
ignore_missing_imports = true

[mypy-django_tables2.views]
ignore_missing_imports = true

[mypy-beartype]
ignore_missing_imports = true

# Guidance for duplicate models error:
# The error 'Source file found twice under different module names: "core.models" and "core.models"'
# is caused by inconsistent PYTHONPATH or import usage. Ensure you always import using the full package path
# (e.g., 'from core.models import ...') and that your PYTHONPATH includes the project root.
# You may also need to clean .pyc files and restart your environment if the error persists.
