<div class="alert alert-danger" role="alert">
    <h4 class="alert-heading">Error</h4>
    <p>{{ message }}</p>
    {% if errors %}
        <ul class="mb-0">
            {% for field, field_errors in errors.items %}
                <li>
                    <strong>{{ field }}</strong>: {{ field_errors|join:", " }}
                </li>
            {% endfor %}
        </ul>
    {% endif %}
</div>
