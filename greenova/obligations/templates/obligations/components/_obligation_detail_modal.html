{% load static obligation_tags %}
{% load django_bootstrap5 %}

{% comment %}
Obligation Detail Modal - Bootstrap 5, accessible, componentized, no logic in template.
This modal is meant to be included in other templates and populated via htmx/hyperscript.
{% endcomment %}
<div class="modal fade"
     id="obligationDetailModal"
     tabindex="-1"
     aria-labelledby="obligationDetailModalLabel"
     aria-hidden="true"
     data-bs-backdrop="static"
     data-bs-keyboard="false">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="obligationDetailModalLabel">Obligation Details</h5>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"></button>
            </div>
            <div class="modal-body" id="obligation-modal-body" tabindex="0">
                <!-- Content loaded dynamically via htmx or hyperscript -->
            </div>
        </div>
    </div>
</div>
