<div id="custom-aspect-container">
    {% if show_field %}
        <div class="mb-3">
            <label for="id_custom_environmental_aspect" class="form-label">
                Custom Environmental Aspect:
            </label>
            <input type="text"
                   name="custom_environmental_aspect"
                   id="id_custom_environmental_aspect"
                   class="form-control"
                   aria-describedby="custom-aspect-help"
                   {% if field.value %}value="{{ field.value }}"{% endif %} />
            <div id="custom-aspect-help" class="form-text">
                Enter a custom aspect if not listed above.
            </div>
        </div>
    {% endif %}
</div>
