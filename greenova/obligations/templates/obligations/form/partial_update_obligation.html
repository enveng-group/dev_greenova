{% extends "core/base.html" %}

{% load crispy_forms_tags %}

{% block content %}
    <main>
        <h1 class="mb-4">Update Obligation (Partial)</h1>
        <form method="post" action="" class="needs-validation" novalidate>
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary">Update</button>
            <a href="{% url 'obligation_list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </main>
{% endblock content %}
