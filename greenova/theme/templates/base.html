{% load static tailwind_tags %}
{% load theme_tags %}
<!DOCTYPE html>
<html lang="en">
	<head>
    <title>Django Tailwind</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta http-equiv="X-UA-Compatible" content="ie=edge">
		{% tailwind_css %}
		<style>
		  :root {
		    --primary-color: {{ primary_color }};
		    --secondary-color: {{ secondary_color }};
		  }
		</style>
	</head>

	<body class="bg-gray-50 font-serif leading-normal tracking-normal {{ theme }}-theme">
		<div class="container mx-auto">
			<header class="flex items-center justify-between py-4">
				<img src="{% get_brand_logo brand_logo %}" alt="Brand Logo" class="h-12" />
				<span class="theme-indicator">Theme: <strong>{% get_theme theme %}</strong></span>
			</header>
			<section class="flex items-center justify-center h-screen">
				<h1 class="text-5xl" style="color: var(--primary-color)">Django + Tailwind = ❤️</h1>
			</section>
		</div>
	</body>
</html>
