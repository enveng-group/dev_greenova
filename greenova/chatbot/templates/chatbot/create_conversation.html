{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}
  New Conversation
{% endblock title %}
{% block content %}
  <main role="main">
    <article>
      <header>
        <h1>Start a New Conversation</h1>
      </header>
      <section aria-labelledby="new-conversation-form">
        <h2 id="new-conversation-form">New Conversation</h2>
        <form method="post" novalidate>
          {% csrf_token %}
          {{ form|crispy }}
          <button type="submit">Create Conversation</button>
          <a href="{% url 'chatbot:chatbot_home' %}"
             role="button"
             class="secondary">Cancel</a>
        </form>
      </section>
    </article>
  </main>
{% endblock content %}
