syntax = "proto3";

package projects;

// Project message for project data
message ProjectProto {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string member_user_ids = 4;
  string created_at = 5;
  string updated_at = 6;
}

// ProjectMembership message for user-project relationships
message ProjectMembershipProto {
  string id = 1;
  string project_id = 2;
  string user_id = 3;
  string role = 4;
  string created_at = 5;
  string updated_at = 6;
}

// ProjectObligation message for project-obligation relationships
message ProjectObligationProto {
  string id = 1;
  string project_id = 2;
  string obligation_id = 3;
  string created_at = 4;
  string updated_at = 5;
}

// Collection of projects
message ProjectCollection {
  repeated ProjectProto projects = 1;
}

// Collection of project memberships
message ProjectMembershipCollection {
  repeated ProjectMembershipProto memberships = 1;
}

// Collection of project obligations
message ProjectObligationCollection {
  repeated ProjectObligationProto project_obligations = 1;
}
