syntax = "proto3";

package greenova.charts;

// Chart data structures for environmental data visualization
message ChartData {
  string chart_id = 1;
  string chart_type = 2;
  string title = 3;
  ChartConfig config = 4;
  repeated DataSeries data_series = 5;
  ChartMetadata metadata = 6;
}

// Chart configuration
message ChartConfig {
  int32 width = 1;
  int32 height = 2;
  string color_scheme = 3;
  bool show_legend = 4;
  bool show_grid = 5;
  AxisConfig x_axis = 6;
  AxisConfig y_axis = 7;
}

// Axis configuration
message AxisConfig {
  string label = 1;
  string data_type = 2;
  double min_value = 3;
  double max_value = 4;
  bool show_ticks = 5;
}

// Data series for charts
message DataSeries {
  string series_name = 1;
  repeated DataPoint data_points = 2;
  string color = 3;
  string line_style = 4;
}

// Individual data points
message DataPoint {
  oneof x_value {
    string string_x = 1;
    double numeric_x = 2;
    int64 timestamp_x = 3;
  }
  double y_value = 4;
  string label = 5;
  map<string, string> metadata = 6;
}

// Chart metadata
message ChartMetadata {
  string data_source = 1;
  int64 generated_at = 2;
  string generated_by = 3;
  repeated string tags = 4;
}

// Environmental metrics chart data
message EnvironmentalMetricsChart {
  string metric_type = 1;
  string measurement_unit = 2;
  repeated MetricDataPoint metric_points = 3;
  MetricThresholds thresholds = 4;
}

// Environmental metric data point
message MetricDataPoint {
  int64 timestamp = 1;
  double value = 2;
  string location = 3;
  string measurement_method = 4;
  ComplianceStatus compliance_status = 5;
}

// Metric thresholds for compliance
message MetricThresholds {
  double warning_threshold = 1;
  double critical_threshold = 2;
  double target_value = 3;
}

// Compliance status enumeration
enum ComplianceStatus {
  COMPLIANT = 0;
  WARNING = 1;
  NON_COMPLIANT = 2;
  UNKNOWN = 3;
}
