syntax = "proto3";

package obligations;

// Obligation message for environmental obligations
message ObligationProto {
  string obligation_number = 1;
  string project_id = 2;
  string primary_environmental_mechanism_id = 3;
  string procedure = 4;
  string environmental_aspect = 5;
  string custom_environmental_aspect = 6;
  string obligation = 7;
  string accountability = 8;
  repeated string responsible_user_ids = 9;
  string project_phase = 10;
  string action_due_date = 11;
  string close_out_date = 12;
  string status = 13;
  string supporting_information = 14;
  string general_comments = 15;
  string evidence_notes = 16;
  bool recurring_obligation = 17;
  string recurring_frequency = 18;
  string recurring_status = 19;
  string recurring_forecasted_date = 20;
  bool inspection = 21;
  string inspection_frequency = 22;
  string site_or_desktop = 23;
  bool new_control_action_required = 24;
  string obligation_type = 25;
  bool gap_analysis = 26;
  string notes_for_gap_analysis = 27;
  string created_at = 28;
  string updated_at = 29;
}

// Collection of obligations
message ObligationCollection {
  repeated ObligationProto obligations = 1;
}
