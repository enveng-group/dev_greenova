syntax = "proto3";

package landing;

// Newsletter signup request message
message NewsletterSignupRequest {
  string email = 1;
}

// Newsletter signup response message
message NewsletterSignupResponse {
  bool success = 1;
  string message = 2;
}

// Feature item for landing page
message Feature {
  string title = 1;
  string description = 2;
}

// Statistic item for landing page
message Stat {
  string name = 1;
  int32 value = 2;
}

// Testimonial item for landing page
message Testimonial {
  string name = 1;
  string content = 2;
}

// Landing page content (for future extensibility)
message LandingPageContent {
  string hero_title = 1;
  string hero_subtitle = 2;
  repeated Feature features = 3;
  repeated Stat stats = 4;
  repeated string benefits = 5;
  repeated Testimonial testimonials = 6;
  string cta_title = 7;
  string cta_subtitle = 8;
}
