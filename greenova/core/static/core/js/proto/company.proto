syntax = "proto3";

package company;

// Company message for organization/company data
message CompanyProto {
  string id = 1;
  string name = 2;
  string logo_url = 3;
  string description = 4;
  string website = 5;
  string address = 6;
  string phone = 7;
  string email = 8;
  string company_type = 9;
  string size = 10;
  string industry = 11;
  bool is_active = 12;
  repeated string member_user_ids = 13;
  string created_at = 14;
  string updated_at = 15;
}

// CompanyMembership message for user-company relationships
message CompanyMembershipProto {
  string id = 1;
  string company_id = 2;
  string user_id = 3;
  string role = 4;
  string department = 5;
  string position = 6;
  string date_joined = 7;
  bool is_primary = 8;
}

// CompanyDocument message for company documents
message CompanyDocumentProto {
  string id = 1;
  string company_id = 2;
  string name = 3;
  string description = 4;
  string file_url = 5;
  string document_type = 6;
  string uploaded_by_user_id = 7;
  string uploaded_at = 8;
}

// Collection of companies
message CompanyCollection {
  repeated CompanyProto companies = 1;
}

// Collection of company memberships
message CompanyMembershipCollection {
  repeated CompanyMembershipProto memberships = 1;
}

// Collection of company documents
message CompanyDocumentCollection {
  repeated CompanyDocumentProto documents = 1;
}
