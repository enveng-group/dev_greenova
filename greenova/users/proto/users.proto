syntax = "proto3";

package users;

// User message for basic user data
message UserProto {
  string id = 1;
  string username = 2;
  string email = 3;
  string first_name = 4;
  string last_name = 5;
  bool is_active = 6;
  string date_joined = 7;
}

// Profile message for user profile data
message ProfileProto {
  string id = 1;
  string user_id = 2;
  string bio = 3;
  string position = 4;
  string department = 5;
  string phone_number = 6;
  string profile_image_url = 7;
  string created_at = 8;
  string updated_at = 9;
}

// Collection of users
message UserCollection {
  repeated UserProto users = 1;
}

// Collection of profiles
message ProfileCollection {
  repeated ProfileProto profiles = 1;
}
