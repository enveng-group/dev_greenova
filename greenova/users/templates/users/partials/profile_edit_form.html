<section class="profile-edit">
  <form method="post" enctype="multipart/form-data"
        hx-post="{% url 'users:profile_edit' %}"
        hx-target=".profile-container"
        _="on submit add .is-submitting to me">
    {% csrf_token %}
    {% load crispy_forms_tags %}
    {{ form|crispy }}
  </form>
</section>
