{% load django_bootstrap5 %}
{% load static %}
{% load hyperscript %}
<section class="py-5 bg-light" aria-labelledby="hero-heading" _="on load if not window.matchMedia('(prefers-reduced-motion: reduce)').matches add .animate-fade-in to me">
  <div class="container d-flex flex-column align-items-center text-center">
    <div class="card border-0 bg-transparent">
      <div class="card-body p-0">
        <h1 id="hero-heading" class="display-4 fw-bold text-success mb-3">Greenova Environmental Management</h1>
        <p class="lead text-secondary mb-4">Simplify compliance. Empower sustainability. Trusted by professionals across industries.</p>
        <a href="#features" class="btn btn-success btn-lg px-5 mb-3" role="button">Explore Features</a>
        <div class="mb-2">
          <img src="{% static 'core/img/greenova_logo.svg' %}" alt="Greenova Logo" class="img-fluid" style="max-height: 64px;" />
        </div>
      </div>
    </div>
  </div>
</section>
