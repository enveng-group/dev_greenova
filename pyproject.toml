[build-system]
requires = ["setuptools", "wheel", "uvenv"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "venv",
    "migrations",
    "node_modules",
    "static",
    "staticfiles",
    "media",
    "stubs",
    "tests",
    "db.sqlite3",
    "db.sqlite3.bak"
]

[tool.ruff.lint]
select = ["ALL"]
ignore = []
fixable = ["ALL"]
unfixable = []
preview = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.isort]
profile = "black"
line_length = 88
atomic = true
force_single_line = true
known_first_party = "greenova"
skip_gitignore = true

[tool.autopep8]
max_line_length = 88
in-place = true
recursive = true
aggressive = 3

[tool.djlint]
profile = "django"
indent = 4
max_line_length = 88
format_css = true
format_js = true
close_void_tags = true
blank_line_after_tag = "load,extends,include"
blank_line_before_tag = "load,extends,include"
format_attribute_template_tags = true
preserve_blank_lines = false
preserve_leading_space = false
use_gitignore = true
require_pragma = false

[tool.vulture]
# Configuration for vulture: https://github.com/jendrikseipp/vulture
# Install in your virtual environment and run:
# python -m vulture | tail -r | less
# The below configuration tries to remove some false positives, but there are
# still many, for example for model properties used only in templates.
# See also:
# https://adamj.eu/tech/2023/07/12/django-clean-up-unused-code-vulture/
exclude = [
  "*/settings.py",
  "*/settings/*.py",
  "*/migrations/*.py",
]
ignore_decorators = [
  # Django
  "@receiver",
  "@register.filter",
  "@register.inclusion_tag",
  "@register.simple_tag",
  # django.contrib.admin
  "@admin.action",
  "@admin.display",
  "@admin.register",
  # pytest
  "@pytest.fixture",
]
ignore_names = [
  # Django
  "*Config",  # AppConfig subclasses
  "*Middleware",
  "clean_*",
  "Meta",
  "urlpatterns",
  # django.contrib.admin
  "get_extra",
  "get_fieldsets",
  "has_add_permission",
  "has_change_permission",
  "has_delete_permission",
  "has_view_permission",
  "lookups",
]
paths = [
  "greenova",
]
sort_by_size = true
min_confidence = 95

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
django_settings_module = "greenova.settings"

[tool.django-stubs]
django_settings_module = "greenova.settings"

# IPython Configuration
[tool.ipython]
# IPython configuration can go here if needed
# Most IPython config is handled in the startup script and Django settings
