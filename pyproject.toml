[project]
name = "greenova"
version = "0.1.0"
description = "Greenova environmental management"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beartype>=0.21.0",
    "cffi==1.17.1",
    "cfgv==3.4.0",
    "cryptography==45.0.3",
    "distlib==0.3.9",
    "django>=5.2.1",
    "django-allauth>=65.9.0",
    "django-browser-reload>=1.18.0",
    "django-cors-headers>=4.7.0",
    "django-debug-toolbar>=5.2.0",
    "django-extensions>=4.1",
    "django-htmx>=1.23.0",
    "django-hyperscript>=1.5.2",
    "django-matplotlib>=0.1",
    "django-pdb>=0.6.2",
    "django-plotly-dash>=2.4.6",
    "django-silk>=5.4.0",
    "django-csp>=3.8",
    "django-filter>=23.5",
    "django-tables2>=2.7",
    "fido2>=2.0.0",
    "filelock==3.18.0",
    "identify==2.6.12",
    "matplotlib>=3.10.3",
    "nodeenv==1.9.1",
    "pandas>=2.2.3",
    "patchelf==0.17.2.2",
    "platformdirs==4.3.8",
    "pycparser==2.22",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.1.0",
    "PyYAML==6.0.2",
    "setuptools==80.9.0",
    "django-crispy-forms>=2.1",
    "crispy-bootstrap4>=2024.2",
    "django-guardian>=2.4.0",
    "django-autocomplete-light>=3.9.7",
    "pillow>=10.3.0",
    "python-slugify>=8.0.4",
    "bleach>=6.1.0",
    "ipython>=9.3.0",
    "django-bootstrap5>=25.1",
    "django-select2>=8.4.1",
    "protobuf==4.25.3",
    "google>=3.0.0",
    "googleapis-common-protos>=1.70.0",
]

[tool.setuptools.packages.find]
include = ["greenova*"]
exclude = ["node_modules*", "logs*"]

[build-system]
requires = ["setuptools", "wheel", "uvenv"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "venv",
    "migrations",
    "node_modules",
    "static",
    "staticfiles",
    "media",
    "stubs",
    "tests",
    "db.sqlite3",
    "db.sqlite3.bak"
]

[tool.ruff.lint]
select = ["ALL"]
ignore = []
fixable = ["ALL"]
unfixable = []
preview = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.isort]
profile = "black"
line_length = 88
atomic = true
force_single_line = true
known_first_party = "greenova"
skip_gitignore = true

[tool.autopep8]
max_line_length = 88
in-place = true
recursive = true
aggressive = 3

[tool.djlint]
profile = "django"
indent = 4
max_line_length = 88
format_css = true
format_js = true
close_void_tags = true
blank_line_after_tag = "load,extends,include"
blank_line_before_tag = "load,extends,include"
format_attribute_template_tags = true
preserve_blank_lines = false
preserve_leading_space = false
use_gitignore = true
require_pragma = false

[tool.vulture]
# Configuration for vulture: https://github.com/jendrikseipp/vulture
# Install in your virtual environment and run:
# python -m vulture | tail -r | less
# The below configuration tries to remove some false positives, but there are
# still many, for example for model properties used only in templates.
# See also:
# https://adamj.eu/tech/2023/07/12/django-clean-up-unused-code-vulture/
exclude = [
  "*/settings.py",
  "*/settings/*.py",
  "*/migrations/*.py",
]
ignore_decorators = [
  # Django
  "@receiver",
  "@register.filter",
  "@register.inclusion_tag",
  "@register.simple_tag",
  # django.contrib.admin
  "@admin.action",
  "@admin.display",
  "@admin.register",
  # pytest
  "@pytest.fixture",
]
ignore_names = [
  # Django
  "*Config",  # AppConfig subclasses
  "*Middleware",
  "clean_*",
  "Meta",
  "urlpatterns",
  # django.contrib.admin
  "get_extra",
  "get_fieldsets",
  "has_add_permission",
  "has_change_permission",
  "has_delete_permission",
  "has_view_permission",
  "lookups",
]
paths = [
  "greenova",
]
sort_by_size = true
min_confidence = 95

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
django_settings_module = "greenova.settings"

[tool.django-stubs]
django_settings_module = "greenova.settings"

# IPython Configuration
[tool.ipython]
# IPython configuration can go here if needed
# Most IPython config is handled in the startup script and Django settings
